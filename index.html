<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bronx Children's Museum - Sensory Explorer</title>
  
  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  
  <!-- MediaPipe Hands SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Minimized, sensory-friendly UI Overlay -->
  <div id="ui-container">
    <h1 id="title-text">Bronx Explorer 🌱</h1>
    <p id="instructions">Level 1: Wave your arms slowly to clear the smog.</p>
    <p><span id="level-text">Level:</span> <span id="level-display">1</span> | Score: <strong id="score">0</strong></p>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button onclick="toggleSettings()">⚙️ Settings</button>
    <button id="lang-btn" onclick="toggleLanguage()">Español</button>
  </div>

  <!-- Customization Panel -->
  <div id="settings-panel">
    <h3>Sensory Settings</h3>
    <label>Bubble Size: <input type="range" id="bubble-size" min="30" max="80" value="45"></label><br><br>
    <label>Calm Mode (Fewer Particles): <input type="checkbox" id="calm-mode"></label><br><br>
    <p><em>Press 'F' on keyboard for Fullscreen</em></p>
    <button onclick="toggleSettings()">Close</button>
  </div>

  <!-- Single Consolidated Script to prevent loading errors -->
  <script src="js/sensory-explorer.js"></script>
</body>
</html>
