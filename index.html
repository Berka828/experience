<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BXCM - Interactive Explorer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <style>
    body {
      margin: 0; padding: 0; background-color: #eaf2ef;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
    }
    #ui-container {
      position: absolute; top: 20px; text-align: center;
      background: rgba(255, 255, 255, 0.9); padding: 15px 30px;
      border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 10;
    }
    h1 { margin: 0; color: #2c5e4f; font-size: 26px; }
    p { margin: 5px 0 0 0; color: #444; font-weight: bold; }
    canvas {
      border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: scaleX(-1); /* Mirrors the webcam */
    }
    #popup {
      display: none; position: absolute; top: 180px; right: 8%;
      background: #fff; padding: 20px; border-radius: 15px; border-left: 8px solid #2c5e4f;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 260px; z-index: 20;
    }
    #popup h3 { margin-top: 0; margin-bottom: 10px; color: #2c5e4f; }
    #popup p { font-weight: normal; font-size: 14px; }
  </style>
</head>
<body>

  <div id="ui-container">
    <h1>Bronx Explorer 🌱</h1>
    <p id="instructions">Level 1: Tap the red pollution to clean the Bronx River!</p>
    <p>Level: <span id="level-display">1</span> | Score: <strong id="score">0</strong></p>
  </div>

  <div id="popup">
    <h3 id="popup-title">Information!</h3>
    <p id="popup-text">Did you know?</p>
  </div>

  <script>
    let video;
    let handpose;
    let predictions = [];
    
    // Game State
    let currentScene = 1;
    let score = 0;
    let itemsCollected = 0;

    // Scene 1 Objects (River)
    let trashItems = [];
    
    // Scene 2 Objects (Garden)
    let cloud = { x: 400, y: 100, width: 150, height: 80 };
    let raindrops = [];
    let flowers = [];

    function setup() {
      createCanvas(800, 600);
      video = createCapture(VIDEO);
      video.size(width, height);
      video.hide(); 

      handpose = ml5.handpose(video, () => console.log('Hand tracking ready!'));
      handpose.on('predict', results => { predictions = results; });

      initScene1();
    }

    function initScene1() {
      trashItems = [];
      for(let i = 0; i < 5; i++){ spawnTrash(); }
    }

    function spawnTrash() {
      trashItems.push({
        x: random(100, width - 100), y: random(height/2 + 50, height - 100),
        radius: 25, active: true
      });
    }

    function spawnRaindrop() {
      raindrops.push({ x: cloud.x + random(-50, 50), y: cloud.y + 40, radius: 10, active: true });
    }

    function showPopup(title, text) {
      document.getElementById('popup-title').innerText = title;
      document.getElementById('popup-text').innerText = text;
      document.getElementById('popup').style.display = 'block';
    }

    function hidePopup() {
      document.getElementById('popup').style.display = 'none';
    }

    function draw() {
      image(video, 0, 0, width, height);
      background(255, 255, 255, 40); // Light overlay for readability

      if (currentScene === 1) {
        drawScene1();
      } else if (currentScene === 2) {
        drawScene2();
      }

      drawSkeleton();
    }

    // --- SCENE 1: BRONX RIVER ---
    function drawScene1() {
      // Draw River
      noStroke(); fill(0, 100, 200, 90);
      rect(0, height/2 + 50, width, height/2 - 50);

      let allClean = true;

      for (let i = 0; i < trashItems.length; i++) {
        let t = trashItems[i];
        if (t.active) {
          allClean = false;
          fill(220, 50, 50, 200); noStroke();
          circle(t.x, t.y, t.radius * 2);

          // Interaction Check
          if (checkCollision(t.x, t.y, t.radius)) {
            t.active = false;
            score += 10;
            itemsCollected++;
            document.getElementById('score').innerText = score;
            showPopup("🐟 River Cleanup!", "Great job! Removing pollution helps local animals like the Alewife fish thrive in the Bronx River.");
          }
        }
      }

      // Progress to Scene 2
      if (allClean && itemsCollected >= 5) {
        currentScene = 2;
        document.getElementById('level-display').innerText = "2";
        document.getElementById('instructions').innerText = "Level 2: Touch the cloud to water the community garden!";
        hidePopup();
      }
    }

    // --- SCENE 2: COMMUNITY GARDEN ---
    function drawScene2() {
      // Draw Soil
      noStroke(); fill(101, 67, 33, 120);
      rect(0, height - 150, width, 150);

      // Draw Cloud
      fill(200, 200, 200, 220); noStroke();
      ellipse(cloud.x, cloud.y, cloud.width, cloud.height);
      ellipse(cloud.x - 40, cloud.y + 10, 80, 60);
      ellipse(cloud.x + 40, cloud.y + 10, 80, 60);

      // Cloud Interaction -> Spawn Rain
      if (checkCollision(cloud.x, cloud.y, cloud.width/2)) {
        if (frameCount % 10 === 0) spawnRaindrop();
        showPopup("🌧️ Watering Time!", "Community gardens in the Bronx provide fresh food. Water helps the seeds break open and grow roots!");
      } else if (frameCount % 100 === 0) {
        hidePopup();
      }

      // Draw and Animate Rain
      for (let i = raindrops.length - 1; i >= 0; i--) {
        let r = raindrops[i];
        if (r.active) {
          fill(0, 150, 255, 200);
          circle(r.x, r.y, r.radius * 2);
          r.y += 5; // Rain falls

          // If rain hits the soil, grow a flower!
          if (r.y > height - 100) {
            r.active = false;
            if (flowers.length < 8) {
              flowers.push({ x: r.x, y: height - 100, size: 0 });
              score += 5;
              document.getElementById('score').innerText = score;
            }
          }
        }
      }

      // Draw Flowers
      for (let f of flowers) {
        if (f.size < 40) f.size += 0.5; // Flower growth animation
        fill(46, 204, 113); rect(f.x - 2, f.y - f.size, 4, f.size); // Stem
        fill(255, 105, 180); circle(f.x, f.y - f.size, f.size/1.5); // Petals
      }
    }

    // --- SKELETON & COLLISION LOGIC ---
    function drawSkeleton() {
      if (predictions.length > 0) {
        let hand = predictions[0];
        
        // 1. Draw Bones (Lines)
        let fingers = ['thumb', 'indexFinger', 'middleFinger', 'ringFinger', 'pinky'];
        for (let i = 0; i < fingers.length; i++) {
          let finger = hand.annotations[fingers[i]];
          noFill(); stroke(255, 255, 255, 150); strokeWeight(4);
          beginShape();
          vertex(hand.landmarks[0][0], hand.landmarks[0][1]); // Connect to palm base
          for (let j = 0; j < finger.length; j++) {
            vertex(finger[j][0], finger[j][1]);
          }
          endShape();
        }

        // 2. Draw Joints (Circles)
        for (let j = 0; j < hand.landmarks.length; j++) {
          let keypoint = hand.landmarks[j];
          fill(255, 200, 0); stroke(200, 100, 0); strokeWeight(2);
          ellipse(keypoint[0], keypoint[1], 10, 10);
        }
      }
    }

    function checkCollision(targetX, targetY, radius) {
      if (predictions.length > 0) {
        // Use the tip of the index finger for interactions
        let indexTip = predictions[0].annotations.indexFinger[3]; 
        let hx = indexTip[0]; let hy = indexTip[1];
        return dist(hx, hy, targetX, targetY) < radius + 20; // 20 is the hit buffer
      }
      return false;
    }
  </script>
</body>
</html>
