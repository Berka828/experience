<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bronx Children's Museum - The Ultimate Explorer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <style>
    body {
      margin: 0; padding: 0; background-color: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
    }
    #ui-container {
      position: absolute; top: 20px; text-align: center;
      background: rgba(255, 255, 255, 0.95); padding: 15px 30px;
      border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10;
    }
    h1 { margin: 0; color: #2c5e4f; font-size: 26px; }
    p { margin: 5px 0 0 0; color: #444; font-weight: bold; }
    canvas {
      border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      transform: scaleX(-1); /* Mirrors the webcam */
    }
    #popup {
      display: none; position: absolute; top: 160px; right: 5%;
      background: #fff; padding: 20px; border-radius: 15px; border-left: 8px solid #2c5e4f;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 280px; z-index: 20;
    }
    #popup h3 { margin-top: 0; margin-bottom: 10px; color: #2c5e4f; }
    #popup p { font-weight: normal; font-size: 15px; }
    #lang-btn {
      position: absolute; bottom: 20px; right: 20px; z-index: 10;
      padding: 10px 20px; background: #2c5e4f; color: white; border: none;
      border-radius: 10px; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h1 id="title-text">Bronx Explorer 🌍</h1>
    <p id="instructions">Level 1: Pinch the red pollution and drop it in the sky to clean the River!</p>
    <p><span id="level-text">Level:</span> <span id="level-display">1</span> | <span id="score-text">Team Score:</span> <strong id="score">0</strong></p>
  </div>

  <div id="popup">
    <h3 id="popup-title">Information!</h3>
    <p id="popup-text">Did you know?</p>
  </div>

  <!-- Physical button note: Spacebar toggles language (Makey Makey ready) -->
  <button id="lang-btn" onclick="toggleLanguage()">Switch to Español (Spacebar)</button>

  <script>
    // --- 1. CORE VARIABLES ---
    let video;
    let handpose, facemesh;
    let handPredictions = [];
    let facePredictions = [];
    
    // Game State
    let currentScene = 1;
    let score = 0;
    let isEnglish = true;
    let playerColors = [ [0, 255, 255], [255, 0, 255], [255, 255, 0] ];

    // Bilingual Dictionary
    const textDict = {
      EN: {
        title: "Bronx Explorer 🌍",
        lvl1: "Level 1: PINCH the red pollution and drag it to clean the River!",
        lvl2: "Level 2: Team up! Touch the clouds to water the seeds!",
        lvl3: "Level 3: The Bronx Beats! Play the instruments together!",
        lvlText: "Level:", scoreText: "Team Score:",
        btn: "Switch to Español (Spacebar)"
      },
      ES: {
        title: "Explorador del Bronx 🌍",
        lvl1: "Nivel 1: ¡Pellizca la contaminación roja y arrástrala para limpiar el río!",
        lvl2: "Nivel 2: ¡Trabajo en equipo! ¡Toca las nubes para regar las semillas!",
        lvl3: "Nivel 3: ¡Ritmos del Bronx! ¡Toca los instrumentos juntos!",
        lvlText: "Nivel:", scoreText: "Puntaje de Equipo:",
        btn: "Cambiar a English (Spacebar)"
      }
    };

    // Level Objects
    let trashItems = [];
    let draggedTrash = null;
    let clouds = [];
    let raindrops = [];
    let flowers = [];
    let instruments = [];
    let communityEnergy = 0;

    // --- 2. SETUP (RUNS ONCE) ---
    function setup() {
      createCanvas(900, 650);
      video = createCapture(VIDEO);
      video.size(width, height);
      video.hide(); 

      // Initialize AI Models
      handpose = ml5.handpose(video, () => console.log('Hand tracking ready!'));
      handpose.on('predict', results => handPredictions = results);

      facemesh = ml5.facemesh(video, () => console.log('Face tracking ready!'));
      facemesh.on('predict', results => facePredictions = results);

      initScene1();
    }

    // --- 3. SCENE INITIALIZERS ---
    function initScene1() {
      for(let i = 0; i < 5; i++){
        trashItems.push({
          x: random(100, width - 100), y: random(height/2 + 50, height - 80),
          radius: 30, active: true
        });
      }
    }

    function initScene2() {
      clouds = [
        { x: width * 0.2, y: 120, w: 120, h: 70 },
        { x: width * 0.5, y: 100, w: 140, h: 80 },
        { x: width * 0.8, y: 120, w: 120, h: 70 }
      ];
    }

    function initScene3() {
      instruments = [
        { x: width * 0.2, y: height/2, radius: 60, type: 'Drum', color: [255, 100, 100] },
        { x: width * 0.5, y: height/2, radius: 70, type: 'Turntable', color: [100, 255, 100] },
        { x: width * 0.8, y: height/2, radius: 60, type: 'Horn', color: [100, 100, 255] }
      ];
    }

    // --- 4. MAIN DRAW LOOP ---
    function draw() {
      image(video, 0, 0, width, height);
      background(255, 255, 255, 30);

      drawFaceMasks(); // AR Face Tracking

      if (currentScene === 1) drawScene1();
      else if (currentScene === 2) drawScene2();
      else if (currentScene === 3) drawScene3();

      drawSkeletonsAndInteractions(); // Hand Tracking & Pinching
    }

    // --- 5. LEVEL 1: PINCH & DRAG PHYSICS ---
    function drawScene1() {
      noStroke(); fill(0, 100, 200, 90); rect(0, height/2 + 50, width, height/2 - 50);

      let activeCount = 0;
      for (let t of trashItems) {
        if (t.active) {
          activeCount++;
          fill(220, 50, 50, 200); noStroke(); circle(t.x, t.y, t.radius * 2);
          
          // If trash is dragged high into the sky (simulating throwing away)
          if (t.y < 150 && draggedTrash === t) {
            t.active = false; draggedTrash = null; score += 20; updateScore();
          }
        }
      }

      if (activeCount === 0) {
        currentScene = 2; updateUI(); initScene2();
      }
    }

    // --- 6. LEVEL 2: CLOUDS & RAIN ---
    function drawScene2() {
      noStroke(); fill(101, 67, 33, 130); rect(0, height - 120, width, 120);

      for (let c of clouds) {
        fill(220, 220, 220, 230); noStroke();
        ellipse(c.x, c.y, c.w, c.h); ellipse(c.x - 30, c.y + 10, c.w*0.7, c.h*0.8); ellipse(c.x + 30, c.y + 10, c.w*0.7, c.h*0.8);

        if (checkHover(c.x, c.y, c.w/2) && frameCount % 8 === 0) {
          raindrops.push({ x: c.x + random(-30,30), y: c.y + 30, active: true });
        }
      }

      for (let r of raindrops) {
        if (r.active) {
          fill(0, 150, 255, 200); circle(r.x, r.y, 12);
          r.y += 6;
          if (r.y > height - 80) {
            r.active = false; score += 2; updateScore();
            if (flowers.length < 15) flowers.push({ x: r.x, y: height - 80, size: 0 });
          }
        }
      }

      let grownFlowers = 0;
      for (let f of flowers) {
        if (f.size < 45) f.size += 0.4; else grownFlowers++;
        fill(46, 204, 113); rect(f.x - 3, f.y - f.size, 6, f.size); 
        fill(255, 150, 200); circle(f.x, f.y - f.size, f.size/1.5); 
      }

      if (grownFlowers >= 15) { currentScene = 3; updateUI(); initScene3(); }
    }

    // --- 7. LEVEL 3: MUSIC (BRONX BEATS) ---
    function drawScene3() {
      fill(50, 50, 50, 200); rect(width/2 - 150, 30, 300, 25, 10);
      fill(255, 215, 0); rect(width/2 - 150, 30, map(communityEnergy, 0, 1000, 0, 300), 25, 10);

      for (let inst of instruments) {
        fill(inst.color[0], inst.color[1], inst.color[2], 200); circle(inst.x, inst.y, inst.radius * 2);
        fill(255); textAlign(CENTER, CENTER); textSize(18); text(inst.type, inst.x, inst.y);

        if (checkHover(inst.x, inst.y, inst.radius)) { communityEnergy += 2; }
      }

      if (communityEnergy >= 1000) {
        document.getElementById('instructions').innerText = isEnglish ? "🎉 YOU SAVED THE BRONX!" : "🎉 ¡SALVASTE EL BRONX!";
      }
    }

    // --- 8. AI TRACKING: HANDS & PINCH PHYSICS ---
    function drawSkeletonsAndInteractions() {
      let isPinchingThisFrame = false;

      for (let k = 0; k < handPredictions.length; k++) {
        let hand = handPredictions[k];
        let pColor = playerColors[k % playerColors.length];

        // Draw skeleton
        for (let j = 0; j < hand.landmarks.length; j++) {
          fill(pColor); noStroke(); ellipse(hand.landmarks[j][0], hand.landmarks[j][1], 10, 10);
        }

        // Pinch Logic (Thumb tip to Index tip distance)
        let thumbTip = hand.annotations.thumb[3];
        let indexTip = hand.annotations.indexFinger[3];
        let pinchDist = dist(thumbTip[0], thumbTip[1], indexTip[0], indexTip[1]);

        if (pinchDist < 40) { // If pinched
          isPinchingThisFrame = true;
          let pinchCenter = { x: (thumbTip[0] + indexTip[0])/2, y: (thumbTip[1] + indexTip[1])/2 };
          fill(255, 255, 255, 200); circle(pinchCenter.x, pinchCenter.y, 30); // Show glowing pinch dot

          if (currentScene === 1) {
            if (!draggedTrash) { // Grab trash if close enough
              for (let t of trashItems) {
                if (t.active && dist(pinchCenter.x, pinchCenter.y, t.x, t.y) < t.radius * 2) {
                  draggedTrash = t; break;
                }
              }
            } else { // Drag it
              draggedTrash.x = pinchCenter.x; draggedTrash.y = pinchCenter.y;
            }
          }
        }
      }
      
      if (!isPinchingThisFrame) draggedTrash = null; // Drop object if pinch released
    }

    function checkHover(targetX, targetY, radius) {
      for (let k = 0; k < handPredictions.length; k++) {
        let indexTip = handPredictions[k].annotations.indexFinger[3]; 
        if (dist(indexTip[0], indexTip[1], targetX, targetY) < radius + 20) return true;
      }
      return false;
    }

    // --- 9. AI TRACKING: AR FACE MASKS ---
    function drawFaceMasks() {
      for (let i = 0; i < facePredictions.length; i++) {
        let face = facePredictions[i];
        let nose = face.annotations.noseTip[0]; // Anchor mask to nose
        
        // Draw a simple AR "Turtle Shell" or "Mask" above the face
        fill(46, 204, 113, 180); stroke(2c5e4f); strokeWeight(3);
        ellipse(nose[0], nose[1] - 50, 120, 80); 
        fill(255); noStroke(); textAlign(CENTER); textSize(14);
        text("Bronx Explorer", nose[0], nose[1] - 50);
      }
    }

    // --- 10. SYSTEM: UI & MAKEY MAKEY ---
    function updateScore() { document.getElementById('score').innerText = score; }

    function updateUI() {
      let lang = isEnglish ? textDict.EN : textDict.ES;
      document.getElementById('level-display').innerText = currentScene;
      if (currentScene === 1) document.getElementById('instructions').innerText = lang.lvl1;
      if (currentScene === 2) document.getElementById('instructions').innerText = lang.lvl2;
      if (currentScene === 3) document.getElementById('instructions').innerText = lang.lvl3;
    }

    function toggleLanguage() {
      isEnglish = !isEnglish;
      let lang = isEnglish ? textDict.EN : textDict.ES;
      document.getElementById('title-text').innerText = lang.title;
      document.getElementById('level-text').innerText = lang.lvlText;
      document.getElementById('score-text').innerText = lang.scoreText;
      document.getElementById('lang-btn').innerText = lang.btn;
      updateUI();
    }

    // Makey Makey Integration (Physical buttons trigger keyboard events)
    // If you hook a Makey Makey up, mapping a physical button to "Spacebar" triggers the language toggle.
    function keyPressed() {
      if (key === ' ') { toggleLanguage(); }
    }
  </script>
</body>
</html>
