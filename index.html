<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bronx Children's Museum - The Ultimate Explorer</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="ui-container">
    <h1 id="title-text">Bronx Explorer 🌍</h1>
    <p id="leaderboard">Global Impact: <strong id="global-score">0</strong> Flowers Planted Today!</p>
    <p id="instructions">Level 1: Wave your arms fast to clear the Bronx smog!</p>
    <p><span id="level-text">Level:</span> <span id="level-display">1</span> | <span id="score-text">Team Score:</span> <strong id="score">0</strong></p>
  </div>

  <button id="lang-btn" onclick="toggleLanguage()">Switch to Español (Spacebar)</button>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
