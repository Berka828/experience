<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bronx Children's Museum - The Ultimate Explorer</title>
  <!-- AI and Canvas Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <h1 id="title-text">Bronx Explorer 🌍</h1>
    <p id="instructions">Level 1: Pinch the red pollution and drop it in the sky to clean the River!</p>
    <p><span id="level-text">Level:</span> <span id="level-display">1</span> | <span id="score-text">Team Score:</span> <strong id="score">0</strong></p>
  </div>

  <div id="popup">
    <h3 id="popup-title">Information!</h3>
    <p id="popup-text">Did you know?</p>
  </div>

  <button id="lang-btn" onclick="toggleLanguage()">Switch to Español (Spacebar)</button>

  <!-- Custom Game Scripts (Order matters!) -->
  <script src="js/ui.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
